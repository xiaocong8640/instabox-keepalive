name: instabox-keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lease activity + observe run age
        env:
          IBX: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -euo pipefail
          API=https://api.instabox.sh
          J=$(curl -sS -H "X-API-Key: $IBX" "$API/v1/machines")
          ID=$(echo "$J" | jq -r '.machines[0].id')
          ST=$(echo "$J" | jq -r '.machines[0].state')
          STARTED=$(echo "$J" | jq -r '.machines[0].runStartedAt')
          MAXRUN=$(echo "$J" | jq -r '.machines[0].maxRunMinutes')
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$STARTED" +%s) ) / 60 ))
          echo "state=$ST  runStartedAt=$STARTED  age=${AGE}min  api_maxRunMinutes=$MAXRUN"

          # 观察模式：若发现机器已被平台停掉，记录停在了多少分钟（这是判定 120 还是 480 的关键证据）
          if [ "$ST" != "running" ]; then
            echo "::warning::MACHINE_WAS_STOPPED state=$ST age_at_detect=${AGE}min"
            curl -sS -X POST -H "X-API-Key: $IBX" "$API/v1/machines/$ID/resume" || \
            curl -sS -X POST -H "X-API-Key: $IBX" "$API/v1/machines/$ID/start" || true
            sleep 15
          fi

          # 租约续期：TTL 1800（30 分钟），cron 每 10 分钟一次，余量充足
          curl -sS -X PUT -H "X-API-Key: $IBX" -H "Content-Type: application/json" \
            -d '{"ttlSeconds":1800}' "$API/v1/machines/$ID/activity-leases/keepalive"
          echo
          echo "lease renewed; age now ${AGE}min"
